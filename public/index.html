<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>2週間共有プランナー</title>
  <style>
    :root{--bg:#f5f6f8;--card:#fff;--text:#20242b;--muted:#69707d;--border:#d8dce3;--accent:#2459d6;--accent-soft:#edf3ff;--weekend:#fafafa;--ok:#176b3a;--warn:#8a5a00;--danger:#a32626}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{width:min(1180px,calc(100% - 24px));margin:22px auto 48px}header{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}h1{margin:0;font-size:clamp(23px,4vw,34px)}.sub{color:var(--muted);margin-top:4px;font-size:14px}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button,input{font:inherit}button{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.status{margin:10px 0 12px;padding:9px 11px;border-radius:10px;font-size:13px;background:#eef2ff;color:#3730a3}.status.ok{background:#edf8f1;color:var(--ok)}.status.warn{background:#fff7e6;color:var(--warn)}.status.error{background:#fff0f0;color:var(--danger)}.editor-panel{display:none;margin:0 0 12px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--card);gap:8px;align-items:center;flex-wrap:wrap}.editor-panel.show{display:flex}.editor-panel label{font-size:13px;color:var(--muted)}.editor-panel input{border:1px solid var(--border);border-radius:9px;padding:8px 10px;min-width:140px;background:#fff}.editor-panel input[type=password]{width:110px;min-width:110px}.mode-badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700;background:#f0f1f4;color:#525a67}.mode-badge.edit{background:var(--accent-soft);color:#184aa9}.table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.035)}table{width:100%;border-collapse:collapse;min-width:820px}th,td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);vertical-align:top}th:last-child,td:last-child{border-right:0}tbody tr:last-child td{border-bottom:0}th{padding:10px;text-align:left;font-size:13px;color:var(--muted);background:#f9fafb;position:sticky;top:0;z-index:1}td.date{width:150px;padding:11px 10px;white-space:nowrap;font-weight:700}td.date small{display:block;margin-top:3px;color:var(--muted);font-weight:500;white-space:normal}tr.today td{background:#f0f6ff}tr.weekend:not(.today) td{background:var(--weekend)}textarea{display:block;width:100%;min-height:84px;padding:10px;border:0;resize:vertical;outline:none;background:transparent;color:var(--text);font:inherit;line-height:1.45}td.note textarea{min-height:100px}textarea:focus{box-shadow:inset 0 0 0 2px var(--accent)}textarea[readonly]{cursor:default}.history{margin-top:14px;border:1px solid var(--border);border-radius:12px;background:#fff}.history summary{cursor:pointer;padding:11px 13px;font-weight:700}.history-list{border-top:1px solid var(--border);max-height:310px;overflow:auto}.history-item{display:grid;grid-template-columns:150px 100px 1fr;gap:10px;padding:9px 13px;border-bottom:1px solid #eceef2;font-size:13px}.history-item:last-child{border-bottom:0}.history-time,.history-field{color:var(--muted)}.empty{padding:12px 13px;color:var(--muted);font-size:13px}.syncdot{width:7px;height:7px;border-radius:50%;background:#9aa1ad;display:inline-block}.syncdot.live{background:#278451}@media(max-width:700px){.wrap{width:min(100% - 12px,1180px);margin-top:12px}header{align-items:flex-start}.history-item{grid-template-columns:1fr;gap:2px}}@media print{body{background:#fff}.wrap{width:100%;margin:0}.actions,.status,.editor-panel,.history{display:none!important}.table-wrap{box-shadow:none;border:1px solid #bbb}table{min-width:0}th{position:static}textarea{resize:none;min-height:60px;overflow:hidden}}
  </style>
</head>
<body>
<main class="wrap">
<header><div><h1>2週間共有プランナー</h1><div class="sub" id="period"></div></div><div class="actions"><span class="syncdot" id="syncDot"></span><span class="mode-badge" id="modeBadge">閲覧専用</span><button id="copyViewBtn" type="button">閲覧URLをコピー</button><button id="copyEditBtn" type="button">編集URLをコピー</button><button id="reloadBtn" type="button">再読み込み</button><button id="printBtn" type="button">印刷 / PDF</button></div></header>
<div class="editor-panel" id="editorPanel"><label>編集者名 <input id="editorName" autocomplete="name" maxlength="40" placeholder="名前"></label><label>PIN <input id="pinInput" type="password" inputmode="numeric" maxlength="20" autocomplete="off"></label><button class="primary" id="unlockBtn" type="button">編集開始</button></div>
<div class="status" id="status">読み込み中...</div>
<div class="table-wrap"><table><thead><tr><th>日付</th><th>1コマ目</th><th>2コマ目</th><th>備考</th></tr></thead><tbody id="plannerBody"></tbody></table></div>
<details class="history"><summary>編集履歴（最近30件）</summary><div class="history-list" id="historyList"><div class="empty">読み込み中...</div></div></details>
</main>
<script>
(()=>{const DAYS=14,POLL_MS=3000,WEEK=["日","月","火","水","木","金","土"],FIELD_LABEL={slot1:"1コマ目",slot2:"2コマ目",note:"備考"},API="/.netlify/functions/planner";const body=document.getElementById("plannerBody"),period=document.getElementById("period"),statusEl=document.getElementById("status"),editorPanel=document.getElementById("editorPanel"),editorNameInput=document.getElementById("editorName"),pinInput=document.getElementById("pinInput"),modeBadge=document.getElementById("modeBadge"),historyList=document.getElementById("historyList"),syncDot=document.getElementById("syncDot");const editRequested=new URLSearchParams(location.search).get("edit")==="1";let rows={},history=[],editUnlocked=false,activePin="",saveTimers={},syncing=false,lastHistorySignature="";if(editRequested){editorPanel.classList.add("show");editorNameInput.value=localStorage.getItem("plannerEditorName")||""}function setStatus(message,type=""){statusEl.textContent=message;statusEl.className="status"+(type?" "+type:"")}function startOfDay(date){const d=new Date(date);d.setHours(0,0,0,0);return d}function addDays(date,n){const d=new Date(date);d.setDate(d.getDate()+n);return d}function dateKey(date){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,"0"),d=String(date.getDate()).padStart(2,"0");return `${y}-${m}-${d}`}function shortDate(date){return `${date.getMonth()+1}/${date.getDate()}`}function escapeHtml(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}function fmtUpdated(value){if(!value)return"未更新";return new Date(value).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}function viewUrl(){const u=new URL(location.href);u.searchParams.delete("edit");return u.toString()}function editUrl(){const u=new URL(location.href);u.searchParams.set("edit","1");return u.toString()}async function copyText(text,label){try{await navigator.clipboard.writeText(text);setStatus(`${label}をコピーしました`,"ok")}catch{window.prompt(`${label}をコピーしてください`,text)}}function render(){body.innerHTML="";const base=startOfDay(new Date()),end=addDays(base,DAYS-1);period.textContent=`${base.getFullYear()}年${base.getMonth()+1}月${base.getDate()}日 〜 ${end.getFullYear()}年${end.getMonth()+1}月${end.getDate()}日`;const today=dateKey(new Date());for(let i=0;i<DAYS;i++){const date=addDays(base,i),key=dateKey(date);if(!rows[key])rows[key]={entry_date:key,slot1:"",slot2:"",note:"",last_editor:"",updated_at:null};const row=rows[key],tr=document.createElement("tr");if(key===today)tr.classList.add("today");if([0,6].includes(date.getDay()))tr.classList.add("weekend");const meta=row.last_editor?`更新: ${escapeHtml(row.last_editor)} / ${escapeHtml(fmtUpdated(row.updated_at))}`:"まだ更新なし";tr.innerHTML=`<td class="date">${shortDate(date)}（${WEEK[date.getDay()]}）<small>${key}</small><small data-meta="${key}">${meta}</small></td><td><textarea data-key="${key}" data-field="slot1" placeholder="予定・作業" ${editUnlocked?"":"readonly"}>${escapeHtml(row.slot1)}</textarea></td><td><textarea data-key="${key}" data-field="slot2" placeholder="予定・作業" ${editUnlocked?"":"readonly"}>${escapeHtml(row.slot2)}</textarea></td><td class="note"><textarea data-key="${key}" data-field="note" placeholder="備考・メモ" ${editUnlocked?"":"readonly"}>${escapeHtml(row.note)}</textarea></td>`;body.appendChild(tr)}document.querySelectorAll("textarea").forEach(el=>el.addEventListener("input",e=>{if(!editUnlocked)return;const key=e.target.dataset.key,field=e.target.dataset.field,value=e.target.value;rows[key][field]=value;scheduleSave(key,field,value)}));updateModeUI()}function renderHistory(){if(!history.length){historyList.innerHTML='<div class="empty">まだ履歴はありません</div>';return}historyList.innerHTML=history.map(item=>`<div class="history-item"><div class="history-time">${escapeHtml(new Date(item.changed_at).toLocaleString("ja-JP"))}</div><div>${escapeHtml(item.editor_name)}</div><div><span class="history-field">${escapeHtml(item.entry_date)} / ${escapeHtml(FIELD_LABEL[item.field_name]||item.field_name)}</span> を更新</div></div>`).join("")}function updateModeUI(){if(editUnlocked){modeBadge.textContent="編集可能";modeBadge.classList.add("edit")}else if(editRequested){modeBadge.textContent="編集ロック中";modeBadge.classList.add("edit")}else{modeBadge.textContent="閲覧専用";modeBadge.classList.remove("edit")}}function updateRowFromServer(row){if(!row?.entry_date)return;rows[row.entry_date]=row;for(const field of ["slot1","slot2","note"]){const el=document.querySelector(`textarea[data-key="${CSS.escape(row.entry_date)}"][data-field="${field}"]`);if(el&&document.activeElement!==el&&el.value!==(row[field]??""))el.value=row[field]??""}const meta=document.querySelector(`[data-meta="${CSS.escape(row.entry_date)}"]`);if(meta)meta.textContent=row.last_editor?`更新: ${row.last_editor} / ${fmtUpdated(row.updated_at)}`:"まだ更新なし"}async function fetchState(quiet=false){if(syncing)return;syncing=true;try{const base=startOfDay(new Date()),start=dateKey(base),end=dateKey(addDays(base,DAYS-1));const res=await fetch(`${API}?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`,{cache:"no-store"});const data=await res.json();if(!res.ok)throw new Error(data.error||`HTTP ${res.status}`);for(const row of data.entries||[])updateRowFromServer(row);for(let i=0;i<DAYS;i++){const key=dateKey(addDays(base,i));if(!(data.entries||[]).some(r=>r.entry_date===key)&&!rows[key])rows[key]={entry_date:key,slot1:"",slot2:"",note:"",last_editor:"",updated_at:null}}if(!body.children.length)render();history=data.history||[];const sig=JSON.stringify(history.map(x=>x.id));if(sig!==lastHistorySignature){lastHistorySignature=sig;renderHistory()}syncDot.classList.add("live");if(!quiet)setStatus(editUnlocked?"保存済み・自動同期中":"閲覧専用・自動同期中","ok")}catch(err){syncDot.classList.remove("live");if(!quiet)setStatus(`同期に失敗しました: ${err.message}`,"error")}finally{syncing=false}}async function apiPost(payload){const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||`HTTP ${res.status}`);return data}async function unlockEditing(){const editorName=editorNameInput.value.trim(),pin=pinInput.value;if(!editorName){setStatus("編集者名を入力してください","warn");editorNameInput.focus();return}if(!pin){setStatus("PINを入力してください","warn");pinInput.focus();return}setStatus("PINを確認中...");try{await apiPost({action:"verify",pin});activePin=pin;editUnlocked=true;localStorage.setItem("plannerEditorName",editorName);pinInput.value="";render();setStatus(`${editorName} として編集できます`,"ok")}catch(err){setStatus(`編集を開始できません: ${err.message}`,"error")}}function scheduleSave(entryDate,field,value){const timerKey=`${entryDate}:${field}`;clearTimeout(saveTimers[timerKey]);saveTimers[timerKey]=setTimeout(()=>saveField(entryDate,field,value),500)}async function saveField(entryDate,field,value){const editorName=editorNameInput.value.trim();if(!editUnlocked||!activePin||!editorName)return;setStatus("保存中...");try{const data=await apiPost({action:"save",pin:activePin,editor_name:editorName,entry_date:entryDate,field,value});if(data.row)updateRowFromServer(data.row);setStatus("保存済み・自動同期中","ok");setTimeout(()=>fetchState(true),250)}catch(err){setStatus(`保存に失敗しました: ${err.message}`,"error")}}document.getElementById("unlockBtn").addEventListener("click",unlockEditing);pinInput.addEventListener("keydown",e=>{if(e.key==="Enter")unlockEditing()});document.getElementById("reloadBtn").addEventListener("click",()=>fetchState(false));document.getElementById("printBtn").addEventListener("click",()=>window.print());document.getElementById("copyViewBtn").addEventListener("click",()=>copyText(viewUrl(),"閲覧URL"));document.getElementById("copyEditBtn").addEventListener("click",()=>copyText(editUrl(),"編集URL"));render();fetchState(false);setInterval(()=>fetchState(true),POLL_MS)})();
</script>
</body>
</html>
