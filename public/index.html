<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月間共有プランナー</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600&display=swap"><link rel="stylesheet" href="/style.css"><script type="module" src="/app.mjs"></script></head>
<body><main><header><div><p class="eyebrow">SHARED PLANNER</p><h1>月間共有プランナー</h1><p>予定をひとつの表で、みんなと共有。</p></div><a id="edit-link" href="?edit=1">編集する</a><button id="logout" hidden>編集を終了</button></header>
<section id="auth" hidden aria-labelledby="auth-title"><h2 id="auth-title">編集を開始</h2><form id="auth-form"><label>編集者名<input id="editor" required maxlength="40" autocomplete="name"></label><label>編集用PIN<input id="pin" type="password" required autocomplete="off"></label><button type="submit">編集を開始</button></form><p id="auth-message" role="status"></p></section>
<div class="view-switch" role="group" aria-label="表示期間"><button id="view-month" aria-pressed="true">月間</button><button id="view-fortnight" aria-pressed="false">2週間</button></div>
<nav aria-label="表示する期間"><button id="prev">← 前月</button><h2 id="month-title"></h2><button id="next">翌月 →</button><button id="today">今日</button></nav>
<div class="weekdays" aria-hidden="true"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="calendar" class="calendar" aria-label="予定カレンダー"></div>
<h2 id="detail-title" class="detail-title"></h2>
<div class="status-bar"><p id="status" role="status" aria-live="polite">読み込み中…</p><button id="retry" hidden>未保存の予定を再試行</button></div><p id="mode">閲覧専用 · 3秒ごとに同期</p>
<div class="table-wrap" tabindex="0" aria-label="選択日の予定"><table><thead><tr><th scope="col">日付</th><th scope="col" id="slot1-heading">1コマ目</th><th scope="col" id="slot2-heading">2コマ目</th><th scope="col">備考</th></tr></thead><tbody id="days"></tbody></table></div>
<details class="history"><summary>最近の変更</summary><ul id="history"></ul><p>履歴には変更日時・編集者・変更した欄を表示します。</p></details><footer>コマの見出し・内容は「保存」で、備考は自動保存されます。編集用PINはこのページを閉じると消去されます。</footer></main><dialog id="slot-dialog" aria-labelledby="dialog-heading"><div class="dialog-header"><h2 id="dialog-heading"></h2><button id="dialog-close" type="button" aria-label="保存せず閉じる">閉じる</button></div><p id="dialog-timetable" class="timetable"></p><form id="slot-form"><label>見出し <span class="hint">120文字以内</span><input id="slot-title" maxlength="240" autocomplete="off"></label><label>内容 <span class="hint">3000文字以内</span><textarea id="slot-content" rows="7" maxlength="6000"></textarea></label><p id="dialog-message" role="status" aria-live="polite"></p><div id="dialog-auth" hidden><label>編集用PIN<input id="dialog-pin" type="password" autocomplete="off"></label><button id="dialog-verify" type="button">再認証する</button><p id="dialog-auth-message" role="status"></p></div><div class="actions"><button id="dialog-save" type="submit">保存</button><button id="dialog-cancel" type="button">キャンセル</button></div></form></dialog></body></html>
