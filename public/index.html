<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月間共有プランナー</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600&display=swap"><link rel="stylesheet" href="/style.css"><script type="module" src="/app.mjs"></script></head>
<body><main><header><div><p class="eyebrow">SHARED PLANNER</p><h1>月間共有プランナー</h1><p>予定をひとつの表で、みんなと共有。</p></div><a id="edit-link" href="?edit=1">編集する</a><button id="logout" hidden>編集を終了</button></header>
<section id="auth" hidden aria-labelledby="auth-title"><h2 id="auth-title">編集を開始</h2><form id="auth-form"><label>編集者名<input id="editor" required maxlength="40" autocomplete="name"></label><label>編集用PIN<input id="pin" type="password" required autocomplete="off"></label><button type="submit">編集を開始</button></form><p id="auth-message" role="status"></p></section>
<nav aria-label="表示する月"><button id="prev" aria-label="前月">← 前月</button><h2 id="month-title"></h2><button id="next" aria-label="翌月">翌月 →</button><button id="today">今月</button></nav>
<div class="status-bar"><p id="status" role="status" aria-live="polite">読み込み中…</p><button id="retry" hidden>未保存の予定を再試行</button></div><p id="mode">閲覧専用 · 3秒ごとに同期</p>
<div class="table-wrap" tabindex="0" aria-label="月間予定表"><table><thead><tr><th scope="col">日付</th><th scope="col" id="slot1-heading">1コマ目</th><th scope="col" id="slot2-heading">2コマ目</th><th scope="col">備考</th></tr></thead><tbody id="days"></tbody></table></div>
<details id="base-panel" hidden><summary>JSON時間割を設定</summary><p>曜日ごとの予定と日付例外を設定します。個別に編集した欄はそのまま保持します。</p><p><a href="/base.example.json" download>JSONの雛形をダウンロード</a></p><div class="actions"><button id="base-load">現在の時間割を読み込む</button><label class="file-label">JSONファイル<input id="base-file" type="file" accept="application/json,.json"></label></div><label>時間割のJSON<textarea id="base-json" rows="12" spellcheck="false"></textarea></label><div class="actions"><button id="base-preview">内容を確認</button><button id="base-apply" disabled>共有時間割に反映</button></div><p id="base-message" role="status"></p><pre id="base-result" hidden></pre></details>
<details class="history"><summary>最近の変更</summary><ul id="history"></ul><p>履歴には変更日時・編集者・変更した欄を表示します。</p></details><footer>共有の予定は自動保存されます。編集用PINはこのページを閉じると消去されます。</footer></main></body></html>
